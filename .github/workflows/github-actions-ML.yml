name: ML Model Release Export

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-export-model:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Setup Python
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==============================
      # 3. Install dependencies
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # 4. Create folders
      # ==============================
      - name: Create folders
        run: mkdir -p models

      # ==============================
      # 5. Run ML training
      # ==============================
      - name: Run model export script
        run: |
          python javascript/scripts/export_model.py ${{ github.ref_name }}

      # ==============================
      # 6. Create GitHub Release
      # ==============================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ML Model ${{ github.ref_name }}
          files: |
            models/model.pkl
            models/vectorizer.pkl
            models/label_encoder.pkl
            models/metrics.json