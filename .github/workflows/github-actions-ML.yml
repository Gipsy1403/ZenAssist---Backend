name: ML Model Release Export

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

jobs:
  build-and-export-model:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Setup Python
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==============================
      # 3. Install dependencies
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # 4. Create folders
      # ==============================
      - name: Create folders
        run: |
          mkdir -p models

      # ==============================
      # 5. Get version
      # ==============================
      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      # ==============================
      # 6. Run ML
      # ==============================
      - name: Run model export script
        run: |
          python javascript/scripts/export_model.py $VERSION

      # ==============================
      # 7. Create GitHub Release (IMPORTANT)
      # ==============================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ML Model ${{ env.VERSION }}
          files: |
            models/model.pkl
            models/vectorizer.pkl
            models/label_encoder.pkl
            models/metrics.json