name: ML Model Release Export

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check structure
      run: ls -R

    - name: Train model
      run: |
        python scripts/export_model.py ${GITHUB_REF_NAME}

    - name: Test model
      run: |
        python scripts/test_model.py ${GITHUB_REF_NAME}

    - name: Verify files
      run: ls -lh models

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ML Model ${{ github.ref_name }}
        files: |
          models/${{ github.ref_name }}_model.pkl
          models/${{ github.ref_name }}_vectorizer.pkl
          models/${{ github.ref_name }}_label_encoder.pkl
          models/${{ github.ref_name }}_metrics.json