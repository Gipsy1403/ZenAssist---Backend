name: ML Model Release Export

on:
  release:
    types: [created]

  workflow_dispatch:

jobs:
  build-and-export-model:
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Récupération du code
      # ==============================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================
      # 2. Setup Python
      # ==============================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==============================
      # 3. Installation des dépendances
      # ==============================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================
      # 4. Création des dossiers nécessaires
      # ==============================
      - name: Create folders
        run: |
          mkdir -p models

      # ==============================
      # 5. Lancement du script ML
      # ==============================
      - name: Run model export script
        run: |
          python javascript/scripts/export_model.py ${{ github.event.release.tag_name }}

      # ==============================
      # 6. Vérification des fichiers générés
      # ============================== 
      - name: Check generated files
        run: |
          ls -R models

      # ==============================
      # 7. Upload des assets dans la release
      # ==============================
     #  - name: Upload release assets
     #    uses: softprops/action-gh-release@v2
     #    with:
     #      files: |
     #        models/model.pkl
     #        models/vectorizer.pkl
     #        models/label_encoder.pkl
     #        models/metrics.json

      - name: Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: |
            models/model.pkl
            models/vectorizer.pkl
            models/label_encoder.pkl
            models/metrics.json
          tag: ${{ github.event.release.tag_name || github.ref_name }}